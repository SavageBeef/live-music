services:
  dev-shell:
    image: node:24-alpine
    entrypoint: tail -f /dev/null
    stdin_open: true
    tty: true
    environment:
      - CHOKIDAR_USEPOLLING=true  # Forces file watching over network mounts
      - WATCHPACK_POLLING=true
      - NODE_ENV=development
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules # Keeps container modules separate
      - shell_history:/root/
      - global_mods:/usr/local/lib/node_modules
      - global_bin:/usr/local/bin
      - npm_cache:/root/.npm
    working_dir: /usr/src/app
    ports:
      - "5000:5000"
      - "5173:5173"

volumes:
  shell_history:
  global_mods:
  global_bin:
  npm_cache:
